services:
  database:
    image: postgis/postgis:18-3.4
    container_name: pageslibres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Initialise la base avec le MPD validé au Jalon 3 (exécuté une seule
      # fois, au premier démarrage du volume). Ce script est une copie de
      # jalons/jalon-3-modelisation-bd/pageslibres_mpd.sql du dépôt de
      # documentation — la copie fait foi pour l'environnement Docker,
      # mais toute évolution de schéma doit passer par une migration
      # Doctrine, pas par une modification manuelle de ce fichier.
      - ./backend/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  php:
    build:
      context: ./backend
    container_name: pageslibres_php
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?serverVersion=18&charset=utf8
      APP_ENV: ${APP_ENV:-dev}
    depends_on:
      database:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: pageslibres_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  frontend:
    build:
      context: ./frontend
    container_name: pageslibres_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:8080
    command: pnpm run dev -- --host 0.0.0.0

  adminer:
    image: adminer:4
    container_name: pageslibres_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - database

volumes:
  db_data:
  frontend_node_modules:
