services:
  database:
    image: postgis/postgis:18-3.6
    container_name: pageslibres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # 55432 côté hôte : le 5432 par défaut est déjà pris par une instance
      # PostgreSQL locale sur cette machine de dev.
      - "55432:5432"
    volumes:
      # PostgreSQL 18+ : le point de montage attend /var/lib/postgresql
      # (pas .../data), la donnée est placée dans une sous-arborescence
      # versionnée par l'image (compatibilité pg_ctlcluster).
      - db_data:/var/lib/postgresql
      # Initialise la base avec le MPD validé au Jalon 3 (exécuté une seule
      # fois, au premier démarrage du volume). Ce script est une copie de
      # jalons/jalon-3-modelisation-bd/pageslibres_mpd.sql du dépôt de
      # documentation — la copie fait foi pour l'environnement Docker,
      # mais toute évolution de schéma doit passer par une migration
      # Doctrine, pas par une modification manuelle de ce fichier.
      - ./backend/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  php:
    build:
      context: ./backend
    container_name: pageslibres_php
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?serverVersion=18&charset=utf8
      APP_ENV: ${APP_ENV:-dev}
    depends_on:
      database:
        condition: service_healthy
    # ./backend est bind-mounté avec l'ownership de l'hôte ; var/ doit
    # rester writable par www-data (utilisateur des workers php-fpm) à
    # chaque démarrage du conteneur.
    command: sh -c "mkdir -p var/cache var/log && chown -R www-data:www-data var && exec docker-php-entrypoint php-fpm"

  nginx:
    image: nginx:1.27-alpine
    container_name: pageslibres_nginx
    restart: unless-stopped
    ports:
      # 8090 côté hôte : le 8080 par défaut est déjà pris par un autre
      # projet Docker sur cette machine de dev.
      - "8090:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  frontend:
    build:
      context: ./frontend
    container_name: pageslibres_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:8090
    command: pnpm exec vite --host 0.0.0.0

  adminer:
    image: adminer:4
    container_name: pageslibres_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - database

volumes:
  db_data:
  frontend_node_modules:
