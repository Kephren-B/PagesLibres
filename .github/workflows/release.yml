name: Release Docker Hub

on:
  push:
    tags: ['v*']

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Backend : image PHP-FPM + nginx (API), dépendances --no-dev.
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pageslibres-backend:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/pageslibres-backend:latest

      # Frontend : bundle statique Vite servi par nginx (pas de node_modules).
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          # La clé Google Books est publique par nature : une clé utilisée côté
          # client se retrouve nécessairement dans le bundle livré au navigateur
          # (cf. § 13.c.3 du dossier de projet). Le secret GitHub évite seulement
          # de la committer ; la protection réelle est la restriction par référent
          # HTTP dans la console Google. Un secret absent donne une valeur vide :
          # l'appel retombe alors sur le quota anonyme.
          build-args: |
            VITE_API_URL=http://localhost:8090
            VITE_GOOGLE_BOOKS_API_KEY=${{ secrets.VITE_GOOGLE_BOOKS_API_KEY }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pageslibres-frontend:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/pageslibres-frontend:latest
