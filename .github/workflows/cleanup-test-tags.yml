name: Cleanup Docker Hub test tags

on:
  workflow_dispatch:

jobs:
  delete-test-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Supprimer les tags de test v0.6-jalon6-test
        run: |
          JWT=$(curl -s -X POST https://hub.docker.com/v2/users/login/ \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${{ secrets.DOCKERHUB_USERNAME }}\",\"password\":\"${{ secrets.DOCKERHUB_TOKEN }}\"}" \
            | python3 -c "import json,sys;print(json.load(sys.stdin)['token'])")

          for repo in pageslibres-backend pageslibres-frontend; do
            echo "Suppression de ${{ secrets.DOCKERHUB_USERNAME }}/$repo:v0.6-jalon6-test"
            code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
              -H "Authorization: JWT $JWT" \
              "https://hub.docker.com/v2/repositories/${{ secrets.DOCKERHUB_USERNAME }}/$repo/tags/v0.6-jalon6-test/")
            echo "HTTP $code"
          done
