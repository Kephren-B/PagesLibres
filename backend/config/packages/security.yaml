security:
    password_hashers:
        # OWASP Password Storage Cheat Sheet : Argon2id recommandé
        # (mémoire 64 MiB, time_cost=4). Les anciens hashes bcrypt ("$2y$")
        # éventuels demeurent vérifiables : Symfony les ré-hashé en Argon2id
        # à la connexion suivante (MigratingPasswordHasher) — aucune rupture
        # pour les comptes existants.
        App\Entity\Utilisateur:
            algorithm: argon2id
            memory_cost: 65536
            time_cost: 4


    providers:
        app_user_provider:
            entity:
                class: App\Entity\Utilisateur
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # Endpoint de connexion (F1) : json_login émet le JWT via les
        # handlers Lexik. login_throttling protège contre le brute-force
        # (RateLimiter, cf. CDC) : au-delà de 5 tentatives échouées en 15
        # minutes pour un même identifiant, l'authentification est bloquée.
        login:
            pattern: ^/api/login
            stateless: true
            json_login:
                check_path: /api/login_check
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                # Handler custom (App\Security\LoginFailureHandler) : distingue
                # identifiants invalides (401) et throttling dépassé (429 +
                # Retry-After), au lieu du handler Lexik par défaut qui renvoie
                # toujours 401.
                failure_handler: App\Security\LoginFailureHandler
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

        # Le reste de l'API : stateless, authentification par JWT quand un
        # token est présent, anonyme sinon (autorisation fine gérée par
        # l'attribut "security" de chaque opération API Platform).
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

    access_control:
        - { path: ^/api/login, roles: PUBLIC_ACCESS }

when@test:
    security:
        password_hashers:
            # Test uniquement : coûts réduits pour garder la suite rapide,
            # tout en restant sur Argon2id (même algorithm qu'en réel).
            App\Entity\Utilisateur:
                algorithm: argon2id
                memory_cost: 1024
                time_cost: 3
