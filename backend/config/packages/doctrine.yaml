doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        server_version: '18'

        profiling_collect_backtrace: '%kernel.debug%'

        # PostGIS ajoute les schémas topology/tiger/tiger_data : à exclure
        # de l'introspection Doctrine (cf. jsor/doctrine-postgis docs).
        schema_filter: ~^(?!tiger)(?!topology)~

        # Types PostGIS (jsor/doctrine-postgis) — requis par
        # Exemplaire::position (GEOMETRY(Point,4326), colonne dénormalisée
        # tenue à jour par le trigger trg_maj_position_exemplaire).
        types:
            geography:
                class: 'Jsor\Doctrine\PostGIS\Types\GeographyType'
            geometry:
                class: 'Jsor\Doctrine\PostGIS\Types\GeometryType'

        # Les 4 CREATE TYPE ... AS ENUM du MPD ne sont pas reconnus par
        # l'introspection DBAL (types PostgreSQL natifs) : on les fait
        # correspondre à "string", cohérent avec le mapping des entités
        # (Types::STRING + enumType PHP côté ORM).
        mapping_types:
            role_utilisateur: string
            statut_exemplaire: string
            type_mouvement: string
            statut_signalement: string
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
