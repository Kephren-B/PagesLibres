server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # En-têtes de sécurité (front) — la CSP autorise les tuiles OpenStreetMap,
    # l'appel Google Books et l'API PagesLibres. 'unsafe-inline' sur style
    # est requis par Leaflet (styles inline sur les marqueurs/tuiles).
    #
    # connect-src doit lister explicitement l'origine de l'API : 'self' ne
    # couvre pas un fetch cross-origin (front et API sur des ports/domaines
    # différents). Cette origine est celle baguée dans le bundle au build
    # (VITE_API_URL, cf. frontend/Dockerfile) — si elle change pour un
    # déploiement donné, ce fichier doit être mis à jour en conséquence
    # (bug réel constaté : sans elle, la CSP bloque silencieusement tous
    # les appels API et l'app affiche une liste de livres vide).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org; connect-src 'self' http://localhost:8090 https://www.googleapis.com https://*.tile.openstreetmap.org; font-src 'self'; object-src 'none'; base-uri 'self'" always;

    # SPA : toute route inconnue sert index.html (routing React).
    location / {
        try_files $uri /index.html;
    }
}
